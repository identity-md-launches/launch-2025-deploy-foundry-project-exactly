[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "app/public" }, { access = "read-write", path = "./out" }, { access = "read", path = "./test" }, { access = "read", path = "./launch.json" }, { access = "read", path = "art/out" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 128
fail_on_revert = true

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[lint]
lint_on_build = false

[profile.fork]
ffi = true
